[project]
name = "app-review-analyzer"
version = "0.1.0"
description = "Analyze app store review exports for sentiment and recurring topics"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.29",
    "pydantic>=2.6",
    "click>=8.1",
    "vaderSentiment>=3.3.2",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "httpx>=0.27",
    "ruff>=0.4",
]

[project.scripts]
app-review-analyzer = "app_review_analyzer.cli:main"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint.per-file-ignores]
# FastAPI's dependency-injection pattern requires calling File()/Depends() in defaults.
"src/app_review_analyzer/api.py" = ["B008"]
